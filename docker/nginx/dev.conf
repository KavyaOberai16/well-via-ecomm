# Dev reverse-proxy. Differences from default.conf:
#   * frontend_upstream points at port 5173 (Vite dev server)
#   * "/" location upgrades the WebSocket so Vite HMR can push updates
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Use Docker's embedded DNS so we don't crash if frontend / backend aren't
    # resolvable at nginx startup (or if they're recreated and change IP).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream_backend "backend:8000";
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location /media/ {
        set $upstream_backend "backend:8000";
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
    }

    location /docs {
        set $upstream_backend "backend:8000";
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $upstream_backend "backend:8000";
        proxy_pass http://$upstream_backend;
    }

    # Vite serves both the SPA and the HMR WebSocket from /
    location / {
        set $upstream_frontend "frontend:5173";
        proxy_pass http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

# Dev overlay — apply on top of docker-compose.yml to get live reload.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Differences from the base file:
#   * frontend: replaced with the Vite dev server inside Node, source is
#     bind-mounted so file edits stream in. node_modules lives in a named
#     volume so the host's directory (possibly Windows-built) doesn't
#     clobber the container's Linux install.
#   * nginx: switched to the dev config which proxies to frontend:5173
#     (Vite) and upgrades HMR WebSockets.
#
# The backend already hot-reloads via `uvicorn --reload` + the source mount
# in the base compose file — no override needed there.

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    # If node_modules is missing (first boot or after a clean), install it.
    # Otherwise jump straight into `npm run dev` for fast restarts.
    command: >
      sh -c "
        if [ ! -d node_modules/vite ]; then npm ci --no-fund --no-audit; fi &&
        npm run dev -- --host 0.0.0.0 --port 5173
      "
    environment:
      # Vite reads this in vite.config.js to point the /api proxy at the
      # backend service name (instead of localhost) when running in Docker.
      VITE_API_PROXY: http://backend:8000
      # Make HMR work over the container port mapping. The browser connects
      # to localhost:5173, so HMR client should advertise that.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # !override replaces the base file's ports list instead of appending,
    # so we don't end up trying to bind 5173:80 AND 5173:5173 at the same time.
    ports: !override
      - "5173:5173"
    depends_on:
      - backend

  nginx:
    volumes:
      # Swap the prod nginx config for a dev one that knows about port 5173
      # and proxies the HMR WebSocket properly.
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  frontend_node_modules:
